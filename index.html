<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Expires" content="0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    
    <title>Para Ti</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@600&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #111827, #1f2937, #374151);
            background-size: 300% 300%;
            animation: fondoGrisMover 8s ease infinite;
            font-family: 'Quicksand', sans-serif;
            color: #ffffff;
            text-align: center;
            overflow: hidden;
            position: relative;
            padding: 20px;
            transition: background 0.8s ease;
        }

        @keyframes fondoGrisMover {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        body.amor-activo {
            background: linear-gradient(-45deg, #ff0f43, #ff527b, #ff758f, #ff1744, #ff85a2);
            background-size: 400% 400%;
            animation: gradientBG 4s linear infinite; /* Animación mucho más rápida y enérgica */
        }
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            background-color: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            padding: 45px 30px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            max-width: 400px;
            width: 100%;
            z-index: 10;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        .container.blanco-amor {
            background-color: rgba(255, 255, 255, 0.95);
            color: #333333;
            box-shadow: 0 20px 50px rgba(255, 15, 67, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.8);
        }
        
        .container.shaking {
            animation: tremor 0.4s ease;
        }
        @keyframes tremor {
            0% { transform: translateX(0); }
            20% { transform: translateX(-12px); }
            40% { transform: translateX(12px); }
            60% { transform: translateX(-12px); }
            80% { transform: translateX(12px); }
            100% { transform: translateX(0); }
        }

        h1 {
            font-size: 2.5rem;
            margin: 0 0 20px 0;
            font-weight: 600;
            transition: all 0.4s ease;
        }
        
        h1.cambio-texto {
            font-family: 'Dancing Script', cursive;
            font-size: 3.5rem;
            color: #ff0f43;
            line-height: 1.2;
        }

        .interaccion-box {
            position: relative;
            display: inline-block;
            margin: 25px 0;
        }

        .btn-corazon {
            background: none;
            border: none;
            font-size: 5.5rem;
            cursor: pointer;
            outline: none;
            display: inline-block;
            animation: latidoSuave 1.5s infinite;
            transition: transform 0.2s;
            z-index: 5;
            position: relative;
        }
        @keyframes latidoSuave {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .flecha-guia {
            position: absolute;
            font-size: 2.5rem;
            color: #ff527b;
            top: -45px;
            left: 50%;
            transform: translateX(-50%);
            animation: brincarFlecha 0.6s infinite alternate;
            pointer-events: none;
        }
        @keyframes brincarFlecha {
            0% { transform: translateX(-50%) translateY(0); }
            100% { transform: translateX(-50%) translateY(-15px); }
        }

        .mensaje-oculto {
            display: none;
            font-size: 1.5rem;
            color: #ff4d6d;
            font-weight: 600;
            border-top: 2px dashed #ffb3c6;
            margin-top: 25px;
            padding-top: 20px;
            animation: fadeIn 0.6s ease forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .corazon-flotante {
            position: absolute;
            bottom: -50px;
            pointer-events: none;
            animation: flotar 3.5s linear forwards;
            z-index: 1;
        }
        @keyframes flotar {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-105vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="container" id="cartaContainer">
        <h1 id="tituloPrincipal">Ya no te quiero...</h1>
        
        <div class="interaccion-box">
            <div class="flecha-guia" id="flecha">👇</div>
            <button class="btn-corazon" id="btnCorazon" onclick="revelarVerdad()">💔</button>
        </div>
        
        <div id="carta" class="mensaje-oculto">
            ahora si es con mas cariño ❤️
        </div>
    </div>

    <audio id="musicaFondo" loop preload="auto"></audio>

    <script>
        document.getElementById('musicaFondo').innerHTML = `<source src="https://soundhelix.com{new Date().getTime()}" type="audio/mpeg">`;

        function revelarVerdad() {
            const container = document.getElementById('cartaContainer');
            const titulo = document.getElementById('tituloPrincipal');
            const btn = document.getElementById('btnCorazon');
            const flecha = document.getElementById('flecha');
            const carta = document.getElementById('carta');
            const musica = document.getElementById('musicaFondo');

            container.classList.add('shaking');
            if(flecha) flecha.style.display = 'none';

            setTimeout(() => {
                document.body.classList.add('amor-activo');
                container.classList.add('blanco-amor');
                
                // Cambia DIRECTO al texto que pediste, sin pasar por el "Buenos días"
                titulo.innerText = "¡PORQUE AHORA TE AMO!";
                titulo.classList.add('cambio-texto');
                
                btn.innerText = "💖";
                btn.style.animation = "latidoRapido 0.4s infinite";
                
                // Muestra la frase corta pedida
                carta.style.display = 'block';

                musica.play().catch(error => console.log("Audio desbloqueado"));
                setInterval(crearCorazon, 180); // Lluvia de corazones más rápida e intensa
            }, 400);
        }

        function crearCorazon() {
            const corazon = document.createElement('div');
            corazon.classList.add('corazon-flotante');
            const tipos = ['❤️', '💖', '💝', '💕', '🌹', '✨'];
            corazon.innerText = tipos[Math.floor(Math.random() * tipos.length)];
            corazon.style.left = Math.random() * 100 + 'vw';
            corazon.style.fontSize = Math.random() * 25 + 15 + 'px';
            corazon.style.animationDuration = Math.random() * 1.5 + 2 + 's';
            document.body.appendChild(corazon);
            setTimeout(() => { corazon.remove(); }, 4000);
        }
    </script>

    <style>
        @keyframes latidoRapido {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }
    </style>

</body>
</html>
